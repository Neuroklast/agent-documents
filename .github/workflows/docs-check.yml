name: docs-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate docs (budgets, frontmatter, links, MANIFEST)
        run: node scripts/check-docs.mjs
      - name: Test installer, host and evaluation contracts
        run: node --test
